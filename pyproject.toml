[project]
name = "aichallenge-mcp-kit"
version = "0.1.0"
description = "Hierarchical MCP hub: child MCPs, Python sandbox, artifacts for AIChallenge Guest MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp>=1.13,<2",
  "uvicorn[standard]>=0.32",
  "starlette>=0.41",
  "pyyaml>=6.0",
]

[project.scripts]
aichallenge-mcp-kit = "aichallenge_mcp_kit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aichallenge_mcp_kit"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
